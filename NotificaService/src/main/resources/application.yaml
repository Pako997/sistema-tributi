spring:
  application:
    name: notifiche-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/tributi}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

notifiche:
  cron: "0 */2 * * * *"
  giorni-sollecito-breve: 15
  giorni-sollecito-lungo: 30

rivalutazione:
  multa-giorni-termine: 60
  multa-giorni-semestre: 180
  multa-maggiorazione-semestrale: 0.10
  multa-tetto-maggiorazione: 0.60
  tasso-legale: 1.60