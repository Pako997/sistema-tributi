spring:
  application:
    name: TributiService

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/tributi}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET}
tributi:
  giorni-minimi-scadenza: 30
config:
  stopBubbling: true
lombok:
  addLombokGeneratedAnnotation: true

